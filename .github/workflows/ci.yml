name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Unit, grammar and process tests
        shell: bash
        run: npm test

      - name: Package the extension
        shell: bash
        run: npx @vscode/vsce package

      - name: Upload the .vsix
        uses: actions/upload-artifact@v4
        with:
          name: fin-vscode-${{ matrix.os }}
          path: "*.vsix"
          if-no-files-found: error

  # The unit suite proves the grammar and the JSONL conversion; only a real VS Code
  # proves the extension activates and paints a squiggle. This job downloads a
  # released Fin compiler so the diagnostics and formatting tests actually run.
  integration:
    name: extension host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Download finc 1.0.0 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # The musl build is static and does not depend on the runner's glibc; the
          # gnu asset crashes on some hosts.
          curl -sSL -o finc.tar.gz \
            https://github.com/M1778/Fin/releases/download/v1.0.0/finc-1.0.0-x86_64-unknown-linux-musl.tar.gz
          tar xzf finc.tar.gz -C "$RUNNER_TEMP"
          echo "FIN_COMPILER=$RUNNER_TEMP/bin/finc" >> "$GITHUB_ENV"
          echo "FIN_STDLIB=$RUNNER_TEMP/lib/std" >> "$GITHUB_ENV"

      - name: Download finc 1.0.0 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then TRIPLE=aarch64-apple-darwin; else TRIPLE=x86_64-apple-darwin; fi
          curl -sSL -o finc.tar.gz \
            "https://github.com/M1778/Fin/releases/download/v1.0.0/finc-1.0.0-${TRIPLE}.tar.gz"
          tar xzf finc.tar.gz -C "$RUNNER_TEMP"
          echo "FIN_COMPILER=$RUNNER_TEMP/bin/finc" >> "$GITHUB_ENV"
          echo "FIN_STDLIB=$RUNNER_TEMP/lib/std" >> "$GITHUB_ENV"

      - name: Download finc 1.0.0 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\finc.zip"
          Invoke-WebRequest -Uri "https://github.com/M1778/Fin/releases/download/v1.0.0/finc-1.0.0-x86_64-pc-windows-msvc.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          "FIN_COMPILER=$env:RUNNER_TEMP\bin\finc.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FIN_STDLIB=$env:RUNNER_TEMP\lib\std" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Locate finfmt
        shell: bash
        run: |
          # finfmt ships beside finc unless the release keeps it under tools/.
          for candidate in "$(dirname "$FIN_COMPILER")/finfmt" \
                           "$(dirname "$FIN_COMPILER")/finfmt.exe" \
                           "$FIN_STDLIB/../../tools/fmt/finfmt"; do
            if [ -x "$candidate" ]; then
              echo "FIN_FORMATTER=$candidate" >> "$GITHUB_ENV"
              break
            fi
          done

      # The 1.0.0 release asset is older than the 1.0.1 tree this extension targets
      # and does not implement `--explain`; on some hosts it crashes on startup.
      # Probe it: when the binary is usable the toolchain tests run, and when it is
      # not the suite still runs (activation, missing-compiler and no-report paths)
      # and reports the toolchain tests as pending instead of pretending they ran.
      - name: Probe the compiler
        shell: bash
        run: |
          if [ -z "${FIN_COMPILER:-}" ]; then
            echo "FIN_TOOLCHAIN=missing" >> "$GITHUB_ENV"
            exit 0
          fi
          VERSION_OUTPUT="$("$FIN_COMPILER" --version 2>&1 || true)"
          echo "finc --version: $VERSION_OUTPUT"
          if ! printf '%s' "$VERSION_OUTPUT" | grep -q '^finc '; then
            echo "::warning::The downloaded finc is not usable on this runner; toolchain tests will be skipped."
            echo "FIN_COMPILER=" >> "$GITHUB_ENV"
            echo "FIN_FORMATTER=" >> "$GITHUB_ENV"
            echo "FIN_STDLIB=" >> "$GITHUB_ENV"
            echo "FIN_TOOLCHAIN=unusable" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "FIN_TOOLCHAIN=usable" >> "$GITHUB_ENV"
          "$FIN_COMPILER" --explain list >/dev/null 2>&1 && echo "FIN_EXPLAIN=yes" >> "$GITHUB_ENV" \
            || echo "FIN_EXPLAIN=no" >> "$GITHUB_ENV"

      # Pinned VS Code, so a failure means this extension changed rather than that a
      # newer build re-shaped a bundle. 1.95.3 is the oldest line the extension
      # declares support for, so the run also proves the `engines` floor.
      - name: Run the extension host suite (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_TEST_VERSION: "1.95.3"

      - name: Run the extension host suite (macOS, Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: npm run test:integration
        env:
          VSCODE_TEST_VERSION: "1.95.3"
